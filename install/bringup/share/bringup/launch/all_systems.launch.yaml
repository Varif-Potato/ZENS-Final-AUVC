launch:
  # Hardware and camera interfaces
  - include:
      file: "$(find-pkg-share bringup)/launch/hardware.launch.yaml"

  # PID controllers (depth hold + heading hold)
  - include:
      file: "$(find-pkg-share bringup)/launch/control.launch.yaml"

  # AprilTag computer vision
  - include:
      file: "$(find-pkg-share bringup)/launch/cv.launch.yaml"

  # AprilTag heading tracking (turns ROV towards detected tag)
  - include:
      file: "$(find-pkg-share cv)/launch/tag_heading.launch.py"

  # Flashing lights behavior (auto-starts when tag < 1m)
  - node:
      pkg: "flashing"
      exec: "flashing_node"
      name: "flashing_node"
      output: "screen"