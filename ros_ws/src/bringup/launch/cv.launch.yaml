launch:
  - arg:
      name: "camera_topic"
      default: "/camera"
      description: "Camera image topic"

  - node:
      pkg: "cv"
      exec: "apriltag_detector_node"
      name: "apriltag_detector"
      output: "screen"
      emulate_tty: "true"
      param:
        - name: "config_dir"
          value: "$(find-pkg-share cv)/config"
        - name: "camera_topic"
          value: "$(var camera_topic)"