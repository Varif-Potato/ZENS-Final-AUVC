launch:
  - arg:
      name: "record"
      default: "true"
      description: "Record sensor topics to a rosbag"

  - arg:
      name: "bag_name"
      default: "ZENS"
      description: "Name of the output bag directory"

  - node:
      pkg: "control"
      exec: "self_arm"
      name: "self_arm"
      output: "screen"

  - include:
      file: "$(find-pkg-share launcher)/launch/hardware.launch.yaml"

  - include:
      file: "$(find-pkg-share launcher)/launch/control.launch.yaml"

  - include:
      file: "$(find-pkg-share launcher)/launch/cv.launch.yaml"

  - include:
      file: "$(find-pkg-share launcher)/launch/web_streamer.launch.yaml"

  - include:
      file: "$(find-pkg-share cv)/launch/tag_heading.launch.yaml"

  - node:
      pkg: "control"
      exec: "finalController"
      name: "finalController"
      output: "screen"

  - node:
      pkg: "flashing"
      exec: "flashing_node"
      name: "flashing_node"
      output: "screen"

  - node:
      pkg: "flashing"
      exec: "lights"
      name: "lights"
      output: "screen"

  - let:
      name: "output_path"
      value: "$(env HOME)/analysis/bag_files/$(var bag_name)_$(command 'date +%Y-%m-%d_%H:%M:%S')"

  - executable:
      cmd: "ros2 bag record -s mcap -o $(var output_path) --topics /imu /pressure /temperature /heading /battery_state /camera /apriltags/annotated /apriltags/detections /yolo/detections /manual_control /target_angle /target_depth /target_lights /override_rc"
      name: "ros2bag_logger"
      output: "screen"
      if: "$(var record)"