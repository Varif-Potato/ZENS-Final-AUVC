launch:
  # Enable/disable bag recording (default: record everything)
  - arg:
      name: "enable_bag_recording"
      default: "true"

  # Hardware and camera interfaces
  - include:
      file: "$(find-pkg-share launcher)/launch/hardware.launch.yaml"

  # PID controllers (depth hold + heading hold)
  - include:
      file: "$(find-pkg-share launcher)/launch/control.launch.yaml"

  # AprilTag computer vision (also runs YOLO if enabled)
  - include:
      file: "$(find-pkg-share launcher)/launch/cv.launch.yaml"

  # AprilTag computer vision web viewer
  - include:
      file: "$(find-pkg-share launcher)/launch/web_streamer.launch.yaml"

  # AprilTag heading tracking (turns ROV towards detected tag)
  - include:
      file: "$(find-pkg-share cv)/launch/tag_heading.launch.py"

  # Flashing lights decision maker (auto-starts when tag < 1m)
  - node:
      pkg: "flashing"
      exec: "flashing_node"
      name: "flashing_node"
      output: "screen"

  # Lights actuator (drives RC override from /target_lights commands)
  - node:
      pkg: "flashing"
      exec: "lights"
      name: "lights"
      output: "screen"

  # ROS 2 bag recording — all topics, MCAP format, zstd compression
  - include:
      file: "$(find-pkg-share launcher)/launch/bag_recording.launch.py"
      if: "$(var enable_bag_recording)"